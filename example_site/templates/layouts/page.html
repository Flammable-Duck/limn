{{ define "page" }}
<!DOCTYPE html>
<html lang="en">
    {{ template "head" }}
    <body>
        {{ template "nav" . }}
        <div class="main">
            <header>
                <h1>{{ .Title }}</h1>
            </header>
            <main>
                {{ template "noteBody" index .Notes "index.html"}}
            </main>

            {{ template "footer" }}
        </div>
    </body>
</html>
{{end}}

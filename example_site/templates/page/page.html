{{ define "page" }}
        <div id="page">
            <header>
                <h1>{{ .Content.Title }}</h1>
            </header>
            <main>
                {{ $page := . }}
                {{ template "noteBody" (index .Content.Notes .NoteName) }}
                <ol>
                {{ range $name, $note := .Content.Notes }}
                    {{ if eq $name "index.html"}} {{continue}} {{end}}
                    <li><a href="{{ $name }}">{{ $note.Title }} </a></li>
                {{ end }}
                </ol>
            </main>
        </div>
{{end}}
